services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bmad_wp
      MARIADB_USER: bmad_user
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bmad_wp
      WORDPRESS_DB_USER: bmad_user
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: bmad_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wp_core:/var/www/html
      - ./plugins/bmad-docs-access:/var/www/html/wp-content/plugins/bmad-docs-access
      - ./themes/bmad-theme:/var/www/html/wp-content/themes/bmad-theme
      - ./php/zz-bmad-dev.ini:/usr/local/etc/php/conf.d/zz-bmad-dev.ini:ro

volumes:
  db_data:
  wp_core:
